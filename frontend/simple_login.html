<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login - Working</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>🔐 Login</h3>
                    </div>
                    <div class="card-body p-4">
                        <div id="alert" class="mb-3"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" value="test@example.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" value="test1234" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                                <span id="btnText">Login</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001';
        const form = document.getElementById('loginForm');
        const alertDiv = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        function showAlert(message, type = 'danger') {
            alertDiv.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.classList.toggle('d-none', loading);
            btnSpinner.classList.toggle('d-none', !loading);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertDiv.innerHTML = '';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Attempting login...', { email });
            setLoading(true);

            try {
                console.log('Fetching:', `${API_URL}/api/auth/login`);
                
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok && data.access_token) {
                    // Store credentials
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    console.log('Token stored:', localStorage.getItem('token') ? 'YES' : 'NO');
                    
                    showAlert('✅ Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'patient.html';
                    }, 1000);
                } else {
                    showAlert(`❌ ${data.message || 'Login failed'}`);
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert(`❌ Network Error: ${error.message}<br><small>Backend URL: ${API_URL}<br>Make sure backend is running on port 5001</small>`);
            } finally {
                setLoading(false);
            }
        });

        // Check backend on page load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`${API_URL}/`);
                if (response.ok) {
                    console.log('✅ Backend is reachable');
                } else {
                    showAlert('⚠️ Backend returned error. Check if server is running.', 'warning');
                }
            } catch (error) {
                showAlert(`⚠️ Cannot reach backend at ${API_URL}<br><small>Error: ${error.message}</small>`, 'warning');
            }
        });
    </script>
</body>
</html>
