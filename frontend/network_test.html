<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3>🔍 Network Diagnostic</h3>
            </div>
            <div class="card-body">
                <div id="status" class="mb-3"></div>
                <button onclick="runDiagnostic()" class="btn btn-primary">Run Full Diagnostic</button>
                <div id="results" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001';
        
        async function runDiagnostic() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="spinner-border"></div> Running diagnostics...';
            let html = '';

            // Test 1: Simple fetch
            html += '<h5 class="mt-3">Test 1: Backend Root</h5>';
            try {
                const response = await fetch(`${API_URL}/`, {
                    method: 'GET',
                    mode: 'cors'
                });
                const data = await response.json();
                html += `<div class="alert alert-success">✅ Success - Status: ${response.status}<br>Response: ${JSON.stringify(data).substring(0, 100)}...</div>`;
            } catch (error) {
                html += `<div class="alert alert-danger">❌ Failed<br>Error: ${error.name}<br>Message: ${error.message}<br>Type: ${typeof error}</div>`;
            }
            results.innerHTML = html;

            // Test 2: Login request
            html += '<h5 class="mt-3">Test 2: Login Request</h5>';
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'test1234'
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    html += `<div class="alert alert-success">✅ Login Success<br>Token received: ${data.access_token ? 'Yes' : 'No'}<br>User: ${data.user?.name}</div>`;
                    
                    // Store token
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                } else {
                    html += `<div class="alert alert-warning">⚠️ Login Failed<br>Status: ${response.status}<br>Message: ${data.message}</div>`;
                }
            } catch (error) {
                html += `<div class="alert alert-danger">❌ Login Request Failed<br>Error: ${error.name}<br>Message: ${error.message}</div>`;
                console.error('Full error:', error);
            }
            results.innerHTML = html;

            // Test 3: With Authorization
            html += '<h5 class="mt-3">Test 3: Authenticated Request</h5>';
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch(`${API_URL}/api/auth/verify`, {
                        method: 'GET',
                        mode: 'cors',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    const data = await response.json();
                    if (response.ok) {
                        html += `<div class="alert alert-success">✅ Token Valid<br>User: ${data.user?.name}</div>`;
                    } else {
                        html += `<div class="alert alert-warning">⚠️ Token Invalid<br>Message: ${data.message}</div>`;
                    }
                } catch (error) {
                    html += `<div class="alert alert-danger">❌ Verify Failed<br>Error: ${error.message}</div>`;
                }
            } else {
                html += `<div class="alert alert-info">ℹ️ No token to test (login first)</div>`;
            }
            results.innerHTML = html;

            // Summary
            html += `
                <div class="mt-4 p-3 bg-light border rounded">
                    <h5>📊 Summary</h5>
                    <p><strong>API URL:</strong> ${API_URL}</p>
                    <p><strong>Browser:</strong> ${navigator.userAgent.split(' ').slice(-2).join(' ')}</p>
                    <p><strong>Page URL:</strong> ${window.location.href}</p>
                    <p><strong>Token Stored:</strong> ${localStorage.getItem('token') ? 'Yes' : 'No'}</p>
                    <hr>
                    <a href="login.html" class="btn btn-primary">Go to Login Page</a>
                    <a href="patient.html" class="btn btn-success ms-2">Go to Patient Page</a>
                </div>
            `;
            results.innerHTML = html;
        }

        // Auto-run on page load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('status').innerHTML = '<div class="alert alert-info">Click "Run Full Diagnostic" to test the connection</div>';
        });
    </script>
</body>
</html>
