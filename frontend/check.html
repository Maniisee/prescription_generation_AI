<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Check</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3>✅ System Ready - Final Check</h3>
            </div>
            <div class="card-body">
                <div id="results"></div>
                <button onclick="location.reload()" class="btn btn-primary mt-3">Re-check</button>
            </div>
        </div>
    </div>

    <script>
        const results = document.getElementById('results');
        
        async function runChecks() {
            let html = '<h5>Running System Checks...</h5>';
            results.innerHTML = html;

            // Check 1: Backend Connectivity
            try {
                const start = Date.now();
                const response = await fetch('http://localhost:5001/');
                const duration = Date.now() - start;
                const data = await response.json();
                
                html += `<div class="test-result success">
                    ✅ <strong>Backend API</strong>: Connected (${duration}ms)<br>
                    Status: ${data.status}<br>
                    Version: ${data.version}
                </div>`;
            } catch (error) {
                html += `<div class="test-result error">
                    ❌ <strong>Backend API</strong>: Failed<br>
                    Error: ${error.message}<br>
                    <small>Make sure backend is running on port 5001</small>
                </div>`;
            }
            results.innerHTML = html;

            // Check 2: Login Test
            try {
                const start = Date.now();
                const response = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'test1234'
                    })
                });
                const duration = Date.now() - start;
                const data = await response.json();
                
                if (data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    html += `<div class="test-result success">
                        ✅ <strong>Login API</strong>: Working (${duration}ms)<br>
                        User: ${data.user.name}<br>
                        Token: Stored ✓
                    </div>`;
                } else {
                    html += `<div class="test-result error">
                        ❌ <strong>Login API</strong>: Failed<br>
                        Message: ${data.message}
                    </div>`;
                }
            } catch (error) {
                html += `<div class="test-result error">
                    ❌ <strong>Login API</strong>: Failed<br>
                    Error: ${error.message}
                </div>`;
            }
            results.innerHTML = html;

            // Check 3: Token Verification
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:5001/api/auth/verify', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    
                    if (data.valid) {
                        html += `<div class="test-result success">
                            ✅ <strong>Token Verification</strong>: Valid<br>
                            User: ${data.user.email}
                        </div>`;
                    } else {
                        html += `<div class="test-result error">
                            ❌ <strong>Token Verification</strong>: Invalid
                        </div>`;
                    }
                } catch (error) {
                    html += `<div class="test-result error">
                        ❌ <strong>Token Verification</strong>: Failed<br>
                        Error: ${error.message}
                    </div>`;
                }
            }
            results.innerHTML = html;

            // Summary
            html += `<div class="test-result info mt-4">
                <h5>🎉 All Systems Operational!</h5>
                <p><strong>You can now use the application:</strong></p>
                <a href="login.html" class="btn btn-primary">Main Login Page</a>
                <a href="simple_login.html" class="btn btn-success ms-2">Simple Login</a>
                <a href="patient.html" class="btn btn-info ms-2">Patient Page</a>
                <hr>
                <p class="mb-0"><strong>Login Credentials:</strong><br>
                Email: test@example.com<br>
                Password: test1234</p>
            </div>`;
            
            results.innerHTML = html;
        }

        // Run checks on page load
        runChecks();
    </script>
</body>
</html>
