<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quick Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>🧪 Quick Full Flow Test</h2>
        <div id="output" class="mt-3"></div>
        <button onclick="runTest()" class="btn btn-primary mt-3">Run Complete Test</button>
    </div>

    <script>
        const API_URL = 'http://localhost:5001';
        const output = document.getElementById('output');

        async function runTest() {
            output.innerHTML = '<div class="spinner-border"></div> Running tests...';
            let html = '';

            try {
                // Step 1: Login
                html += '<h4 class="mt-3">Step 1: Login</h4>';
                const loginRes = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'test@example.com', password: 'test1234' })
                });
                const loginData = await loginRes.json();
                
                if (!loginRes.ok) {
                    html += `<div class="alert alert-danger">❌ Login failed: ${loginData.message}</div>`;
                    output.innerHTML = html;
                    return;
                }
                
                const token = loginData.access_token;
                html += `<div class="alert alert-success">✅ Login successful</div>`;
                output.innerHTML = html;

                // Step 2: Create Patient
                html += '<h4 class="mt-3">Step 2: Create Patient</h4>';
                const patientRes = await fetch(`${API_URL}/api/patient/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        age: 30,
                        gender: 'male',
                        blood_pressure_systolic: 120,
                        blood_pressure_diastolic: 80,
                        temperature: 102,
                        pulse: 85,
                        weight: 70,
                        symptoms: 'Fever, Cough, Body aches',
                        medical_history: 'None'
                    })
                });
                const patientData = await patientRes.json();
                
                if (!patientRes.ok) {
                    html += `<div class="alert alert-danger">❌ Patient creation failed: ${patientData.message}</div>`;
                    output.innerHTML = html;
                    return;
                }
                
                const patientId = patientData.patient_id;
                html += `<div class="alert alert-success">✅ Patient created (ID: ${patientId})</div>`;
                output.innerHTML = html;

                // Step 3: Get Diagnosis
                html += '<h4 class="mt-3">Step 3: Diagnose Disease</h4>';
                const diagnosisRes = await fetch(`${API_URL}/api/diagnosis/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        patient_id: patientId,
                        symptoms: ['Fever', 'Cough', 'Body aches'],
                        vitals: {
                            temperature: 102,
                            pulse: 85,
                            blood_pressure_systolic: 120,
                            blood_pressure_diastolic: 80
                        }
                    })
                });
                const diagnosisData = await diagnosisRes.json();
                
                if (!diagnosisRes.ok) {
                    html += `<div class="alert alert-danger">❌ Diagnosis failed: ${diagnosisData.message}</div>`;
                    output.innerHTML = html;
                    return;
                }
                
                const diagnosisId = diagnosisData.diagnosis_id;
                const prediction = diagnosisData.prediction;
                html += `<div class="alert alert-success">✅ Diagnosis: ${prediction.disease} (${prediction.confidence}% confidence)</div>`;
                output.innerHTML = html;

                // Step 4: Generate Prescription
                html += '<h4 class="mt-3">Step 4: Generate Prescription</h4>';
                const prescriptionRes = await fetch(`${API_URL}/api/prescription/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        diagnosis_id: diagnosisId
                    })
                });
                const prescriptionData = await prescriptionRes.json();
                
                if (!prescriptionRes.ok) {
                    html += `<div class="alert alert-danger">❌ Prescription failed: ${prescriptionData.message}</div>`;
                    output.innerHTML = html;
                    return;
                }
                
                const prescription = prescriptionData.prescription;
                html += `<div class="alert alert-success">✅ Prescription generated!</div>`;
                html += `<div class="card mt-3">
                    <div class="card-body">
                        <h5>Medications:</h5>
                        <ul>${prescription.medications.map(m => `<li>${m.name} - ${m.dosage} ${m.frequency}</li>`).join('')}</ul>
                        <h5>Instructions:</h5>
                        <ul>${prescription.instructions.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>
                </div>`;
                
                html += '<div class="alert alert-success mt-3"><h3>🎉 All tests passed!</h3></div>';
                output.innerHTML = html;

            } catch (error) {
                html += `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
                output.innerHTML = html;
            }
        }
    </script>
</body>
</html>
